name: Publish Lite Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

concurrency:
  group: publish-lite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release branch source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vX.Y.Z format, for example v0.1.0" >&2
            exit 1
          fi
          git fetch origin release
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          release_commit="$(git rev-parse origin/release)"
          if [[ "${tag_commit}" != "${release_commit}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must point to the current origin/release tip" >&2
            exit 1
          fi

  frontend:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check and build frontend
        working-directory: frontend
        run: |
          pnpm run typecheck
          pnpm exec vite build

      - name: Upload embedded frontend
        uses: actions/upload-artifact@v4
        with:
          name: embedded-frontend
          path: backend/internal/web/dist
          if-no-files-found: error
          retention-days: 1

  backend_test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

  build_binary:
    needs:
      - verify
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Download embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: backend/internal/web/dist

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Build linux/amd64 binary
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source_commit="$(git rev-parse HEAD)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags embed \
            -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME} -X main.Commit=${source_commit} -X main.Date=${build_date} -X main.BuildType=release" \
            -o ../sub2api \
            ./cmd/server

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          binary_dir="release-assets/sub2api-linux-amd64"
          deploy_dir="release-assets/sub2api-deploy-${GITHUB_REF_NAME}"
          mkdir -p "${binary_dir}" "${deploy_dir}"
          cp sub2api LICENSE README.md README_CN.md "${binary_dir}/"
          cp -a deploy/lite/. "${deploy_dir}/"
          sed -i "s#^APP_IMAGE=.*#APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}#" "${deploy_dir}/.env.example"
          tar -czf release-assets/sub2api-linux-amd64.tar.gz -C "${binary_dir}" .
          tar -czf "release-assets/sub2api-deploy-${GITHUB_REF_NAME}.tar.gz" -C "${deploy_dir}" .
          cd release-assets
          sha256sum sub2api-linux-amd64.tar.gz "sub2api-deploy-${GITHUB_REF_NAME}.tar.gz" > checksums.txt

      - name: Upload release inputs
        shell: bash
        run: |
          tar -czf publish-inputs.tar.gz sub2api release-assets

      - name: Store release inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: publish-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - backend_test
      - build_binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download release inputs
        uses: actions/download-artifact@v4
        with:
          name: release-inputs

      - name: Restore release inputs
        run: tar -xzf publish-inputs.tar.gz

      - name: Validate lite Compose configuration
        shell: bash
        env:
          APP_IMAGE: ghcr.io/ywainzh/sub2api:${{ github.ref_name }}
          DOCKER_GID: 121
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ADMIN_PASSWORD: ci-admin-password
          OPENCODE_MIHOMO_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: docker compose -f deploy/lite/docker-compose.yml config --quiet

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          source_commit="$(git rev-parse HEAD)"
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.goreleaser \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.revision=${source_commit}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "${image}" \
            --push \
            .
          docker buildx imagetools inspect "${image}"
          echo "name=${image}" >> "${GITHUB_OUTPUT}"

      - name: Verify anonymous GHCR access
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker logout ghcr.io
          docker manifest inspect "${IMAGE_NAME}" >/dev/null

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          cat > release-assets/release-notes.md <<EOF
          ## Lite deployment release

          - Source branch: \`release\`
          - Source commit: \`${source_commit}\`
          - Runtime image: \`${IMAGE_NAME}\`
          - Architecture: \`linux/amd64\`

          The server only needs the deployment archive and Docker Compose. It does not compile source code.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/sub2api-linux-amd64.tar.gz \
            "release-assets/sub2api-deploy-${GITHUB_REF_NAME}.tar.gz" \
            release-assets/checksums.txt \
            --verify-tag \
            --title "Sub2API Lite ${GITHUB_REF_NAME}" \
            --notes-file release-assets/release-notes.md
